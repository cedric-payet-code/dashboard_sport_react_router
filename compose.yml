services:
  react:
    container_name: react
    build:
      context: app/
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - /app/node_modules
    # Installe les dépendances manquantes à chaque démarrage (le volume node_modules
    # ci-dessus est conservé entre deux builds et ne voit pas les nouveaux paquets)
    command: sh -c "yarn install && yarn dev --host 0.0.0.0"

  api:
    container_name: api
    build:
      context: P6JS/
    ports:
      - "8000:8000"
    volumes:
      - ./P6JS:/app
      - /app/node_modules
    command: yarn dev